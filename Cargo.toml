[package]
name = "srt-deduplicator"
version = "0.1.0"
edition = "2024"
description = "Compacts consecutive runs of identical subtitle text in SRT files."
license-file = "LICENSE"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
srtlib = "0.2"

[dev-dependencies]
tempfile = "3"

# Release builds favour a small, self-contained binary over compile speed:
# fat LTO with one codegen unit, and debug symbols stripped from the shipped
# executable. Runtime speed is not a meaningful goal for this tool, so the
# default optimisation level is left alone.
[profile.release]
lto = true
codegen-units = 1
strip = true
