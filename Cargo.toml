[package]
name = "srt-deduplicator"
version = "0.1.0"
edition = "2024"
description = "Compacts consecutive runs of identical subtitle text in SRT files."
license-file = "LICENSE"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
srtlib = "0.2"

[dev-dependencies]
tempfile = "3"
